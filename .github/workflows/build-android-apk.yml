name: Build All Exam India APK

on:
  push:
    paths:
      - 'android/**'
      - 'assets/army-inspired-crest.svg'
      - '.github/workflows/build-android-apk.yml'
      - 'app-update.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify signing secrets
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Decode release keystore
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/all-exam-india-release.jks"
          test -s "$RUNNER_TEMP/signing/all-exam-india-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/signing/all-exam-india-release.jks" >> "$GITHUB_ENV"

      - name: Validate release signing key
        run: |
          if ! keytool -list -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::STORE_PASSWORD_OR_ALIAS_INVALID"
            exit 1
          fi
          echo "STORE_PASSWORD_AND_ALIAS_OK"
          if ! keytool -certreq -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -file "$RUNNER_TEMP/signing/key-validation.csr" >/dev/null 2>&1; then
            echo "::error::KEY_PASSWORD_OR_PRIVATE_KEY_INVALID"
            exit 1
          fi
          echo "KEY_PASSWORD_OK"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Python image tools
        run: python -m pip install --disable-pip-version-check cairosvg pillow

      - name: Generate app icons from website logo
        working-directory: android
        run: python tools/generate_launcher_icons.py

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build signed release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-exam-india-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare APK for release
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/all-exam-india.apk

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: All Exam India - Latest APK
          body: Signed latest installable Android APK for All Exam India.
          files: release/all-exam-india.apk
          overwrite_files: true
          make_latest: true
